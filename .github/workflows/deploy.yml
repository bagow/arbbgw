name: Deploy Crypto Arbitrage Stack

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_vps_api:
        description: 'Deploy vps-api'
        type: boolean
        default: false
      deploy_core:
        description: 'Deploy core-node (single-process engine)'
        type: boolean
        default: false
      deploy_cloudflared:
        description: 'Setup Cloudflare Tunnel on VPS'
        type: boolean
        default: false
      deploy_cloudflare:
        description: 'Deploy Cloudflare Worker & Assets'
        type: boolean
        default: false

concurrency:
  group: arb-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUILD_SHA: ${{ github.sha }}

jobs:
  # --- 0. Cargo check для всего workspace (блокирует деплой при ошибке) ---
  check:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Workspace check
        run: |
          set -o pipefail
          cargo check --workspace 2>&1 | tee ci-check.log
      - name: Unit tests (PnL, lot sizing, utils)
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee ci-test.log
      - name: Release build
        run: |
          set -o pipefail
          cargo build --release -p core-node -p vps-api 2>&1 | tee ci-release.log
      - name: Publish check logs to a service branch
        if: always() && github.event_name == 'push'
        timeout-minutes: 2
        run: |
          set -eu
          export GIT_INDEX_FILE="$RUNNER_TEMP/arb-ci-report-index"
          git read-tree --empty
          git add -f ci-*.log
          report_tree=$(git write-tree)
          report_commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit-tree "$report_tree" -m "CI logs for $GITHUB_SHA")
          git push origin "$report_commit:refs/heads/ci-results/$GITHUB_SHA"
      - name: Preserve tested release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            target/release/core-node
            target/release/vps-api
          retention-days: 14
      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs-${{ github.sha }}
          path: ci-*.log
          retention-days: 14
      - name: Copy check logs to audit directory on VPS
        if: always() && github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "ci-*.log"
          target: "/home/opc/arb-ci/${{ github.sha }}/"
          command_timeout: 2m

  # --- 0.1 Lint и аудит зависимостей (НЕ блокирует деплой) ---
  lint:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies (RUSTSEC)
        run: cargo audit
        continue-on-error: true

  # --- 1. Проверка изменений ---
  changes:
    runs-on: ubuntu-22.04
    outputs:
      vps_api:    ${{ steps.filter.outputs.vps_api }}
      core:       ${{ steps.filter.outputs.core }}
      cloudflared: ${{ steps.filter.outputs.cloudflared }}
      cloudflare: ${{ steps.filter.outputs.cloudflare }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vps_api:
              - '.github/workflows/deploy.yml'
              - 'vps-api/**'
              - 'vps-api.service'
              - '.github/scripts/migrate-vps-env.py'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            core:
              - '.github/workflows/deploy.yml'
              - 'core-node/**'
              - 'core-node.service'
              - 'shared/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            cloudflared:
              - 'cloudflared.service'
            cloudflare:
              - '.github/workflows/deploy.yml'
              - 'src/**'
              - 'public/**'
              - 'wrangler.toml'

  # --- 2. Деплой vps-api ---
  deploy-vps-api:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_vps_api == 'true' ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.vps_api == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download tested release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: target/release
      - name: Copy Binary to VPS
        timeout-minutes: 10
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/vps-api"
          target: "/tmp/deploy/"
          command_timeout: 10m
          strip_components: 2
      - name: Copy Service to VPS
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "vps-api.service,.github/scripts/migrate-vps-env.py"
          target: "/tmp/deploy/"
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            sudo python3 /tmp/deploy/.github/scripts/migrate-vps-env.py
            sudo mv /tmp/deploy/vps-api /usr/local/bin/
            sudo chown root:root /usr/local/bin/vps-api
            sudo chmod +x /usr/local/bin/vps-api
            sudo restorecon -v /usr/local/bin/vps-api
            if [ -f /tmp/deploy/vps-api.service ]; then
              sudo mv /tmp/deploy/vps-api.service /etc/systemd/system/
              sudo restorecon -v /etc/systemd/system/vps-api.service
              sudo systemctl daemon-reload
              sudo systemctl enable vps-api
            fi
            sudo systemctl restart vps-api
            sudo systemctl status vps-api

  # --- 3. Деплой core-node (single-process: collector + trader) ---
  deploy-core:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_core == 'true' ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download tested release binaries
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: target/release
      - name: Copy to VPS
        timeout-minutes: 20
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/core-node"
          target: "/tmp/deploy/"
          command_timeout: 20m
          strip_components: 2
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            sudo mv /tmp/deploy/core-node /usr/local/bin/
            sudo chown root:root /usr/local/bin/core-node
            sudo chmod +x /usr/local/bin/core-node
            sudo restorecon -v /usr/local/bin/core-node
            mkdir -p /home/opc/core-node
            cat > /tmp/core-node.service << 'SERVICEEOF'
            [Unit]
            Description=CEX Arbitrage Core Node
            After=network-online.target time-sync.target
            Wants=network-online.target

            [Service]
            Type=simple
            User=opc
            WorkingDirectory=/home/opc/core-node
            ExecStart=/usr/local/bin/core-node
            Restart=on-failure
            RestartSec=5
            StartLimitInterval=60
            StartLimitBurst=5
            EnvironmentFile=/etc/core-node.env
            OOMScoreAdjust=-600
            LimitNOFILE=65536
            TimeoutStopSec=5
            KillMode=process
            StandardOutput=journal
            StandardError=journal
            SyslogIdentifier=core-node

            [Install]
            WantedBy=multi-user.target
            SERVICEEOF
            sed -i 's/^            //' /tmp/core-node.service
            sudo mv /tmp/core-node.service /etc/systemd/system/core-node.service
            sudo chmod 644 /etc/systemd/system/core-node.service
            sudo restorecon -v /etc/systemd/system/core-node.service
            
            sudo systemctl daemon-reload
            sudo systemctl enable core-node
            sudo systemctl restart core-node
            ready=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3003/health; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" = 1
            sudo systemctl is-active --quiet core-node
            echo "=== Profiles in use ==="
            sudo journalctl -u core-node --no-pager -n 30 | grep -E "STARTUP|Profiles DB|vol=" || true

  # --- 4. Деплой Cloudflare Tunnel (cloudflared) на VPS ---
  deploy-cloudflared:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_cloudflared == 'true' ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.cloudflared == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared, setup tunnel & service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            if ! command -v cloudflared &>/dev/null; then
              curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
              sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
              sudo chmod +x /usr/local/bin/cloudflared
            fi
            printf 'CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}\n' > /tmp/cloudflared.env
            sudo mv /tmp/cloudflared.env /etc/cloudflared.env
            sudo chmod 600 /etc/cloudflared.env
            printf '[Unit]\nDescription=Cloudflare Tunnel arb-api\nAfter=network.target\n\n[Service]\nType=simple\nUser=opc\nEnvironmentFile=/etc/cloudflared.env\nExecStart=/usr/local/bin/cloudflared tunnel --edge-ip-version 4 --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}\nRestart=always\nRestartSec=5\nStandardOutput=journal\nStandardError=journal\n\n[Install]\nWantedBy=multi-user.target\n' > /tmp/cloudflared.service
            sudo mv /tmp/cloudflared.service /etc/systemd/system/cloudflared.service
            sudo chmod 644 /etc/systemd/system/cloudflared.service
            sudo systemctl daemon-reload
            sudo systemctl enable cloudflared
            sudo systemctl restart cloudflared
            sleep 3
            sudo systemctl status cloudflared --no-pager

  # --- 5. Деплой в Cloudflare ---
  deploy-cloudflare:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_cloudflare == 'true' ||
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.cloudflare == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Show Node/NPM versions
        run: node -v && npm -v
      - name: Deploy Worker & Assets (direct Wrangler CLI)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@3.114.12 deploy
