name: Deploy Crypto Arbitrage Stack

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_vps_api:
        description: 'Deploy vps-api'
        type: boolean
        default: false
      deploy_collector:
        description: 'Deploy rust-collector'
        type: boolean
        default: false
      deploy_paper:
        description: 'Deploy paper-trader'
        type: boolean
        default: false
      deploy_real:
        description: 'Deploy real-trader'
        type: boolean
        default: false
      deploy_core:
        description: 'Deploy core-node (single-process engine)'
        type: boolean
        default: false
      deploy_cloudflared:
        description: 'Setup Cloudflare Tunnel on VPS'
        type: boolean
        default: false
      deploy_cloudflare:
        description: 'Deploy Cloudflare Worker & Assets'
        type: boolean
        default: false

jobs:
  # --- 0. Cargo check для всего workspace (блокирует деплой при ошибке) ---
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Workspace check
        run: cargo check --workspace

  # --- 1. Проверка изменений ---
  changes:
    runs-on: ubuntu-latest
    outputs:
      vps_api:    ${{ steps.filter.outputs.vps_api }}
      collector:  ${{ steps.filter.outputs.collector }}
      paper:      ${{ steps.filter.outputs.paper }}
      real:       ${{ steps.filter.outputs.real }}
      core:       ${{ steps.filter.outputs.core }}
      cloudflared: ${{ steps.filter.outputs.cloudflared }}
      cloudflare: ${{ steps.filter.outputs.cloudflare }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vps_api:
              - 'vps-api/**'
              - 'vps-api.service'
              - 'shared/**'
              - 'Cargo.toml'
            collector:
              - 'rust-collector/**'
              - 'shared/**'
              - 'Cargo.toml'
            paper:
              - 'paper-trader/**'
              - 'shared/**'
              - 'Cargo.toml'
            real:
              - 'real-trader/**'
              - 'real-trader.service'
              - 'shared/**'
              - 'Cargo.toml'
            core:
              - 'core-node/**'
              - 'core-node.service'
              - 'shared/**'
              - 'Cargo.toml'
            cloudflared:
              - 'cloudflared.service'
            cloudflare:
              - 'src/**'
              - 'public/**'
              - 'wrangler.toml'

  # --- 2. Деплой vps-api ---
  deploy-vps-api:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_vps_api == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.vps_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      # Workspace build — binary lands in target/release/ (not vps-api/target/)
      - name: Build vps-api
        run: cargo build --release -p vps-api
      - name: Copy to VPS
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/vps-api,vps-api.service"
          target: "/tmp/deploy/"
          strip_components: 0
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/deploy/target/release/vps-api /usr/local/bin/
            sudo chown root:root /usr/local/bin/vps-api
            sudo chmod +x /usr/local/bin/vps-api
            sudo restorecon -v /usr/local/bin/vps-api 2>/dev/null || true
            if [ -f /tmp/deploy/vps-api.service ]; then
              sudo mv /tmp/deploy/vps-api.service /etc/systemd/system/
              sudo systemctl daemon-reload
              sudo systemctl enable vps-api
            fi
            sudo systemctl restart vps-api
            sudo systemctl status vps-api

  # --- 3. Деплой rust-collector ---
  deploy-collector:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_collector == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build rust-collector
        run: cargo build --release -p rust-collector
      - name: Copy to VPS
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/rust-collector"
          target: "/tmp/deploy/"
          strip_components: 2
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/deploy/rust-collector /usr/local/bin/
            sudo chown root:root /usr/local/bin/rust-collector
            sudo chmod +x /usr/local/bin/rust-collector
            sudo restorecon -v /usr/local/bin/rust-collector 2>/dev/null || true
            sudo systemctl restart rust-collector
            sudo systemctl status rust-collector

  # --- 4. Деплой paper-trader ---
  deploy-paper:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_paper == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.paper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build paper-trader
        run: cargo build --release -p paper-trader
      - name: Copy to VPS
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/paper-trader"
          target: "/tmp/deploy/"
          strip_components: 2
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/deploy/paper-trader /usr/local/bin/
            sudo chown root:root /usr/local/bin/paper-trader
            sudo chmod +x /usr/local/bin/paper-trader
            sudo restorecon -v /usr/local/bin/paper-trader 2>/dev/null || true
            sudo systemctl restart paper-trader
            sudo systemctl status paper-trader

  # --- 5. Деплой real-trader ---
  deploy-real:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_real == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.real == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build real-trader
        run: cargo build --release -p real-trader
      - name: Copy to VPS
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/real-trader,real-trader.service"
          target: "/tmp/deploy/"
          strip_components: 0
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/deploy/target/release/real-trader /usr/local/bin/
            sudo chown root:root /usr/local/bin/real-trader
            sudo chmod +x /usr/local/bin/real-trader
            sudo restorecon -v /usr/local/bin/real-trader 2>/dev/null || true
            if [ -f /tmp/deploy/real-trader.service ]; then
              sudo mv /tmp/deploy/real-trader.service /etc/systemd/system/
              sudo systemctl daemon-reload
              sudo systemctl enable real-trader
            fi
            sudo systemctl restart real-trader
            sudo systemctl status real-trader

  # --- 6. Деплой core-node (single-process: collector + trader) ---
  deploy-core:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_core == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build core-node
        run: cargo build --release -p core-node
      - name: Copy to VPS
        timeout-minutes: 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "target/release/core-node"
          target: "/tmp/deploy/"
          strip_components: 2
      - name: Install and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/deploy/core-node /usr/local/bin/
            sudo chown root:root /usr/local/bin/core-node
            sudo chmod +x /usr/local/bin/core-node
            sudo restorecon -v /usr/local/bin/core-node 2>/dev/null || true
            mkdir -p /home/opc/core-node
            printf '[Unit]\nDescription=CEX Arbitrage Core Node\nAfter=network-online.target time-sync.target\nWants=network-online.target\n\n[Service]\nType=simple\nUser=opc\nWorkingDirectory=/home/opc/core-node\nExecStart=/usr/local/bin/core-node\nRestart=on-failure\nRestartSec=5\nStartLimitInterval=60\nStartLimitBurst=5\nEnvironmentFile=-/etc/core-node.env\nOOMScoreAdjust=-600\nLimitNOFILE=65536\nStandardOutput=journal\nStandardError=journal\nSyslogIdentifier=core-node\n\n[Install]\nWantedBy=multi-user.target\n' > /tmp/core-node.service
            sudo mv /tmp/core-node.service /etc/systemd/system/core-node.service
            sudo chmod 644 /etc/systemd/system/core-node.service
            sudo restorecon /etc/systemd/system/core-node.service 2>/dev/null || true
            ls -la /etc/systemd/system/core-node.service
            sudo systemctl daemon-reload
            sudo systemctl enable core-node
            sudo systemctl restart core-node || true
            sudo systemctl status core-node --no-pager

  # --- 7. Деплой Cloudflare Tunnel (cloudflared) на VPS ---
  deploy-cloudflared:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_cloudflared == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.cloudflared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared, setup tunnel & service on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            if ! command -v cloudflared &>/dev/null; then
              curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
              sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
              sudo chmod +x /usr/local/bin/cloudflared
            fi
            printf 'CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}\n' > /tmp/cloudflared.env
            sudo mv /tmp/cloudflared.env /etc/cloudflared.env
            sudo chmod 600 /etc/cloudflared.env
            printf '[Unit]\nDescription=Cloudflare Tunnel arb-api\nAfter=network.target\n\n[Service]\nType=simple\nUser=opc\nEnvironmentFile=/etc/cloudflared.env\nExecStart=/usr/local/bin/cloudflared tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}\nRestart=always\nRestartSec=5\nStandardOutput=journal\nStandardError=journal\n\n[Install]\nWantedBy=multi-user.target\n' > /tmp/cloudflared.service
            sudo mv /tmp/cloudflared.service /etc/systemd/system/cloudflared.service
            sudo chmod 644 /etc/systemd/system/cloudflared.service
            sudo restorecon /etc/systemd/system/cloudflared.service 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable cloudflared
            sudo systemctl restart cloudflared
            sleep 3
            sudo systemctl status cloudflared --no-pager

  # --- 7. Деплой в Cloudflare ---
  deploy-cloudflare:
    needs: [check, changes]
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_cloudflare == 'true' ||
      github.event_name == 'push' && needs.changes.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Worker & Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --var PASS_DIMA:${{ secrets.PASS_DIMA }} --var PASS_SERGEI:${{ secrets.PASS_SERGEI }}
