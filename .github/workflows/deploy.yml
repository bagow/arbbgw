name: Deploy Crypto Arbitrage Stack

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. Сборка Rust (VPS часть) ---
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build rust-collector
        run: cargo build --release --manifest-path rust-collector/Cargo.toml

      - name: Build paper-trader
        run: cargo build --release --manifest-path paper-trader/Cargo.toml

      - name: Build real-trader
        run: cargo build --release --manifest-path real-trader/Cargo.toml

      # --- 2. Загрузка на VPS и перезапуск ---
      - name: Copy binaries to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "rust-collector/target/release/rust-collector,paper-trader/target/release/paper-trader,real-trader/target/release/real-trader"
          target: "/tmp/deploy"
          strip_components: 3 # Чтобы в /tmp/deploy оказались только файлы

      - name: Install binaries and Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo mv /tmp/deploy/rust-collector /usr/local/bin/
            sudo mv /tmp/deploy/paper-trader /usr/local/bin/
            sudo mv /tmp/deploy/real-trader /usr/local/bin/
            sudo chown root:root /usr/local/bin/rust-collector /usr/local/bin/paper-trader /usr/local/bin/real-trader
            sudo chmod +x /usr/local/bin/rust-collector /usr/local/bin/paper-trader /usr/local/bin/real-trader
            sudo restorecon -v /usr/local/bin/rust-collector /usr/local/bin/paper-trader /usr/local/bin/real-trader
            sudo systemctl restart rust-collector paper-trader real-trader
            sudo systemctl status rust-collector paper-trader real-trader

      # --- 3. Деплой Cloudflare (Worker & Dashboard) ---
      - name: Deploy Cloudflare Worker & Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
