name: Debug DB (Manual Only)
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnostic dump
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            echo "=== core-node binary timestamp ==="
            ls -la /usr/local/bin/core-node

            echo ""
            echo "=== core-node service status ==="
            sudo systemctl status core-node --no-pager | tail -8

            echo ""
            echo "=== core-node last 60 log lines ==="
            sudo journalctl -u core-node -n 60 --no-pager

            echo ""
            echo "=== /etc/core-node.env (may override PROFILES_DB_PATH) ==="
            cat /etc/core-node.env 2>/dev/null || echo "(file does not exist — using defaults)"

            echo ""
            echo "=== trading_profiles raw from SQLite ==="
            sqlite3 /home/opc/core-node/vps-api.db \
              "SELECT id, name, mode, is_active, trade_volume FROM trading_profiles" \
              2>/dev/null || echo "sqlite3 not available"

            echo ""
            echo "=== last 10 trades inserted (volume column) ==="
            sqlite3 /home/opc/core-node/paper-trader.db \
              "SELECT id, pair, volume, profile_id, entry_time FROM trades ORDER BY entry_time DESC LIMIT 10" \
              2>/dev/null || echo "sqlite3 not available"
