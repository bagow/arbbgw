name: Debug DB (Manual Only)
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and dump DB
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            echo "=== trading_profiles (id | name | mode | is_active | trade_volume | min_entry_spread | take_profit_percent) ==="
            sqlite3 /home/opc/core-node/vps-api.db \
              "SELECT id, name, mode, is_active, trade_volume, min_entry_spread, take_profit_percent FROM trading_profiles ORDER BY created_at ASC" \
              2>/dev/null || echo "FAIL: sqlite3 not available — use /api/debug_ps instead"

            echo ""
            echo "=== vps-api service status ==="
            sudo systemctl status vps-api --no-pager | tail -5

            echo ""
            echo "=== core-node last 20 log lines (settings) ==="
            sudo journalctl -u core-node -n 20 --no-pager | grep -E "settings|vol=|Profiles DB" || echo "(no matching lines)"

            echo ""
            echo "=== /api/debug_ps endpoint ==="
            curl -s http://localhost:4000/api/debug_ps || echo "FAIL"
