name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build Rust components ────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build rust-collector
        working-directory: ./rust-collector
        run: cargo build --release

      - name: Build paper-trader
        working-directory: ./paper-trader
        run: cargo build --release

      - name: Build real-trader
        working-directory: ./real-trader
        run: cargo build --release

      # ── Transfer and Restart ──────────────────────────────────────────────────
      - name: Copy binaries and files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: |
            ./rust-collector/target/release/rust-collector
            ./paper-trader/target/release/paper-trader
            ./real-trader/target/release/real-trader
            ./vps-api/*
            ./*.service
          target: "/tmp"
          strip_components: 0

      - name: Setup and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Create directories
            sudo mkdir -p /usr/local/bin /home/opc/vps-api
            
            # Move binaries and set permissions
            sudo mv /tmp/rust-collector/target/release/rust-collector /usr/local/bin/
            sudo mv /tmp/paper-trader/target/release/paper-trader /usr/local/bin/
            sudo mv /tmp/real-trader/target/release/real-trader /usr/local/bin/
            sudo chmod +x /usr/local/bin/rust-collector /usr/local/bin/paper-trader /usr/local/bin/real-trader
            
            # Setup vps-api
            sudo cp -r /tmp/vps-api/* /home/opc/vps-api/
            cd /home/opc/vps-api && npm install --production
            
            # Setup systemd services
            sudo cp /tmp/real-trader.service /etc/systemd/system/
            sudo cp /tmp/vps-api/cex-api.service /etc/systemd/system/
            # (Note: paper-trader and rust-collector services will be added in next step)
            
            sudo systemctl daemon-reload
            sudo systemctl enable rust-collector paper-trader cex-api real-trader
            sudo systemctl restart rust-collector paper-trader cex-api real-trader
            
            # Cleanup
            rm -rf /tmp/rust-collector /tmp/paper-trader /tmp/real-trader /tmp/vps-api
