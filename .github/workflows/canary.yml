name: Guarded live six-dollar canary

on:
  push:
    branches: ["fix/audit-risk-20260909"]
    paths: [".github/canary-request.json"]

permissions:
  contents: write

concurrency:
  group: guarded-live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Run guarded one-trade canary over SSH
        env:
          ARB_CANARY_HOST: ${{ secrets.VPS_SSH_HOST }}
          ARB_CANARY_USER: ${{ secrets.VPS_SSH_USER }}
          ARB_CANARY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, time
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arb-canary-ssh'
          directory.mkdir(mode=0o700)
          key = directory / 'key'
          fd = os.open(key, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as stream:
              stream.write(os.environ['ARB_CANARY_KEY'] + '\n')
          destination = os.environ['ARB_CANARY_USER'] + '@' + os.environ['ARB_CANARY_HOST']
          options = ['-i',str(key),'-o','BatchMode=yes','-o','ConnectTimeout=15',
              '-o','ServerAliveInterval=10','-o','ServerAliveCountMax=5',
              '-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(directory/'known_hosts')]
          source = pathlib.Path('scripts/run_live_canary.py').read_text()
          config = json.loads(pathlib.Path('.github/canary-request.json').read_text())
          task = ('arb-canary-' + os.environ['GITHUB_SHA'] + '-' +
                  os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])

          def remote_python(program, payload, timeout=60):
              encoded = base64.b64encode(program.encode()).decode()
              command = "python3 -c 'import base64;exec(base64.b64decode(\"" + encoded + "\"))'"
              return subprocess.run(
                  ['ssh',*options,destination,command], input=json.dumps(payload),
                  capture_output=True,text=True,timeout=timeout,
              )

          bootstrap = r'''
          import base64,json,os,pathlib,subprocess,sys
          payload=json.load(sys.stdin)
          directory=pathlib.Path('/tmp')/payload['task']
          directory.mkdir(mode=0o700,exist_ok=False)
          script=directory/'run.py'
          config=directory/'config.json'
          temporary=directory/'result.tmp'
          result=directory/'result.json'
          log=directory/'runner.log'
          script.write_bytes(base64.b64decode(payload['source']))
          config.write_text(json.dumps(payload['config']))
          supervisor=r"""import os,pathlib,subprocess,sys
          script,config,temporary,result,log=sys.argv[1:]
          with open(config) as stdin,open(temporary,'w') as stdout,open(log,'w') as stderr:
              completed=subprocess.run([sys.executable,script],stdin=stdin,stdout=stdout,stderr=stderr)
          os.replace(temporary,result)
          pathlib.Path(result+'.exit').write_text(str(completed.returncode))
          """
          process=subprocess.Popen(
              [sys.executable,'-c',supervisor,str(script),str(config),str(temporary),str(result),str(log)],
              stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,
              start_new_session=True,close_fds=True,
          )
          (directory/'pid').write_text(str(process.pid))
          print(json.dumps({'started':True,'pid':process.pid}))
          '''
          poll = r'''
          import base64,json,os,pathlib,sys
          payload=json.load(sys.stdin)
          directory=pathlib.Path('/tmp')/payload['task']
          result=directory/'result.json'
          if result.exists():
              print(json.dumps({'status':'complete','result':base64.b64encode(result.read_bytes()).decode()}))
          elif (directory/'pid').exists():
              pid=int((directory/'pid').read_text())
              try:
                  os.kill(pid,0)
                  status='running'
              except ProcessLookupError:
                  status='failed'
              print(json.dumps({'status':status}))
          else:
              print(json.dumps({'status':'missing'}))
          '''
          cleanup = r'''
          import json,pathlib,shutil,sys
          payload=json.load(sys.stdin)
          directory=pathlib.Path('/tmp')/payload['task']
          if directory.parent==pathlib.Path('/tmp') and directory.name.startswith('arb-canary-'):
              shutil.rmtree(directory,ignore_errors=True)
          '''
          try:
              started = remote_python(bootstrap, {
                  'task':task,
                  'source':base64.b64encode(source.encode()).decode(),
                  'config':config,
              })
              if started.returncode:
                  detail=(started.stderr or started.stdout or 'no diagnostic').strip().splitlines()[-1][:500]
                  raise RuntimeError(
                      'could not start detached remote canary '
                      f'(exit {started.returncode}): {detail}'
                  )
              deadline=time.monotonic()+3200
              consecutive_poll_errors=0
              while time.monotonic()<deadline:
                  time.sleep(10)
                  try:
                      checked=remote_python(poll,{'task':task},timeout=45)
                      if checked.returncode:
                          raise RuntimeError('poll SSH failed')
                      state=json.loads(checked.stdout)
                      consecutive_poll_errors=0
                  except Exception:
                      consecutive_poll_errors+=1
                      if consecutive_poll_errors<12:
                          continue
                      raise RuntimeError('remote canary polling unavailable for two minutes')
                  if state.get('status')=='running':
                      continue
                  if state.get('status')!='complete':
                      raise RuntimeError('detached remote canary exited without a report')
                  report=base64.b64decode(state['result']).decode()
                  json.loads(report)
                  pathlib.Path('canary-result.json').write_text(report)
                  remote_python(cleanup,{'task':task})
                  break
              else:
                  raise TimeoutError('detached remote canary exceeded workflow deadline')
              if not json.loads(pathlib.Path('canary-result.json').read_text()).get('ok'):
                  raise SystemExit('guarded canary failed; inspect canary-result artifact')
          except Exception as exc:
              if not pathlib.Path('canary-result.json').exists():
                  pathlib.Path('canary-result.json').write_text(json.dumps({
                      'ok':False,'error':type(exc).__name__+': '+str(exc),
                      'detached_watchdog_expected':True,
                  }))
              raise
          finally:
              key.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('canary-result.json') != ''
        with:
          name: live-canary-${{ github.sha }}
          path: canary-result.json
      - name: Publish sanitized result in a service branch
        if: always() && hashFiles('canary-result.json') != ''
        run: |
          set -eu
          export GIT_INDEX_FILE="$RUNNER_TEMP/arb-canary-report-index"
          git read-tree --empty
          git add -f canary-result.json
          report_tree=$(git write-tree)
          report_commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit-tree "$report_tree" -m "Live canary report for $GITHUB_SHA")
          git push origin "$report_commit:refs/heads/canary-results/$GITHUB_SHA-$GITHUB_RUN_ID"
