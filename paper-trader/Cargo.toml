[package]
name = "paper-trader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "paper-trader"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
# HTTP client (to push archive to Worker)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite (bundled = no system lib needed)
rusqlite = { version = "0.31", features = ["bundled"] }
# Async SQLite wrapper
tokio-rusqlite = "0.5"
# Utilities
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

