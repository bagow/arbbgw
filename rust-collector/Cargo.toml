[package]
name = "rust-collector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-collector"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# WebSocket (older version for older rustc)
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# HTTP push (downgrade to 0.11 for older rustc)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Concurrent map
dashmap = "6"
# .env support
dotenvy = "0.15"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# URL encoding (pin to 2.3 to avoid icu_normalizer_data needing rustc 1.83)
url = "=2.3.1"
# Misc
anyhow = "1"
# gzip decompression for HTX and BingX binary WS frames
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
