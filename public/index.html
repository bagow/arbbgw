<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time CEX arbitrage scanner and trading engine dashboard">
    <title>CEX Arb — Trading Engine</title>
    <link rel="stylesheet" href="style.css?v=32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
    <!-- ── Tab Panel Area ────────────────────────────────────────────────────── -->
    <div id="panel-container" class="mt-layout">
        <div class="mt-panel" id="mt-panel">
            <div class="mt-loading">
                <div class="spinner"></div>
                <span>Connecting to arbitrage node…</span>
            </div>
        </div>
    </div>



    <!-- ── Login Modal ───────────────────────────────────────────────────────── -->
    <div id="login-modal" class="modal-backdrop hidden" style="z-index: 99999;">
        <div class="modal-dialog" style="max-width:380px;margin:auto;text-align:center;">
            <div style="margin-bottom:24px;">
                <div style="font-size:32px;margin-bottom:8px;">🔒</div>
                <h3 style="margin:0;font-size:1.2rem;">Node Authentication</h3>
                <div style="color:var(--text-sub);font-size:0.85rem;margin-top:8px;">Please enter your credentials to access the arbitrage network.</div>
            </div>
            <form id="login-form" autocomplete="on">
                <div class="form-group" style="text-align:left;margin-bottom:16px;">
                    <label>Username</label>
                    <input type="text" id="login-username" name="username" style="width:100%;box-sizing:border-box;" required />
                </div>
                <div class="form-group" style="text-align:left;margin-bottom:24px;">
                    <label>Password</label>
                    <input type="password" id="login-password" name="password" style="width:100%;box-sizing:border-box;" required />
                </div>
                <div id="login-error" style="color:var(--red);font-size:0.8rem;margin-bottom:16px;min-height:20px;"></div>
                <button type="submit" class="trading-save-btn" style="width:100%;margin:0;padding:12px;">Connect</button>
            </form>
        </div>
    </div>

    <!-- ── Chart Modal (Integrated) ────────────────────────────────────────── -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
        <div class="modal">
            <div class="modal-header" style="display:flex; flex-direction:column; gap:16px;">
                <div style="display:flex; justify-content:space-between; width:100%; align-items:flex-start;">
                    <div>
                        <div class="modal-title" id="modal-title">–</div>
                        <div class="modal-sub" id="modal-sub">–</div>
                    </div>
                    <button class="modal-close" id="modal-close" style="align-self:flex-start;">✕</button>
                </div>
                <div class="modal-header-right" style="width:100%;">
                    <div class="tf-bar" style="display:flex; width:100%; gap:8px;">
                        <button class="tf-btn tf-btn--active" data-tf="60" id="tf-1m">1m</button>
                        <button class="tf-btn" data-tf="180" id="tf-3m">3m</button>
                        <button class="tf-btn" data-tf="300" id="tf-5m">5m</button>
                        <button class="tf-btn" data-tf="900" id="tf-15m">15m</button>
                        <a id="tv-link" class="tv-btn" href="#" target="_blank" rel="noopener noreferrer">TV</a>
                    </div>
                </div>
            </div>
            <div id="chart-legend" class="chart-legend"></div>
            <div class="charts-wrap">
                <div class="chart-row chart-row--price">
                    <div class="chart-row-label" id="label-prices">Price (USD)</div>
                    <div class="chart-svg-wrap" id="price-wrap">
                        <svg id="chart-prices" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
                            <g id="grid-p" class="grid"></g>
                            <g id="ylabel-p" class="axis-labels"></g>
                            <g id="price-lines"></g>
                            <rect id="overlay-p" fill="transparent" style="cursor:crosshair" />
                        </svg>
                    </div>
                </div>
                <div class="chart-row chart-row--hist">
                    <div class="chart-row-label">Δ Spread</div>
                    <div class="chart-svg-wrap" id="hist-wrap">
                        <svg id="chart-hist" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
                            <g id="grid-h" class="grid"></g>
                            <g id="ylabel-h" class="axis-labels"></g>
                            <g id="xlabel-h" class="axis-labels"></g>
                            <g id="bars-hist"></g>
                            <g id="bars-live"></g>
                            <line id="zero-line" class="zero-line" />
                            <rect id="overlay-h" fill="transparent" style="cursor:crosshair" />
                        </svg>
                    </div>
                </div>
                <div id="chart-volume-info" class="volume-info"></div>
            </div>
            <div class="legend" id="legend-dynamic"></div>
        </div>
    </div>

    <!-- ── Exchange Modal ────────────────────────────────────────────────────── -->
    <div id="exchange-modal" class="modal-backdrop hidden">
        <div class="modal-dialog" style="max-width:600px;margin:auto;max-height:80vh;">
            <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
                <h3 id="exchange-modal-title" style="margin:0;">Exchange</h3>
                <button id="close-exchange-modal" style="background:none;border:none;color:var(--text-sub);cursor:pointer;font-size:1.5rem;">&times;</button>
            </div>
            <div id="exchange-modal-content" style="overflow-y:auto;background:var(--bg-row-alt);padding:12px;border-radius:8px;font-family:monospace;white-space:pre-wrap;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="chart.js?v=33"></script>
    <script src="trading.js?v=33"></script>
</body>
</html>
