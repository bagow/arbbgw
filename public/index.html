<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEX Arb — Trading</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header class="topbar">
        <span class="mobile-page-title" id="mobile-page-title">Trading</span>

        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>

        <nav class="nav-menu" id="nav-menu">
          <a href="chart.html" class="nav-btn" id="nav-scanner">Scanner</a>
          <a href="index.html" class="nav-btn nav-btn--active" id="nav-trading">Trading</a>
        </nav>
    </header>

    <!-- ── Tab Panel Area ────────────────────────────────────────────────────── -->
    <div class="mt-layout">
        <div class="mt-panel" id="mt-panel">
            <!-- Injected by JS: sub-nav + content for active tab -->
            <div class="mt-loading">Loading profiles…</div>
        </div>
    </div>

    <!-- ── Bottom Tab Bar ────────────────────────────────────────────────────── -->
    <div class="tab-bar" id="tab-bar">
        <!-- tabs injected by JS -->
        <button class="tab-add-btn" id="tab-add-btn" title="New trading profile">＋</button>
    </div>

    <!-- ── New Tab Modal ─────────────────────────────────────────────────────── -->
    <div id="new-tab-modal" class="modal-backdrop hidden">
        <div class="modal" style="max-width:420px;">
            <h3 style="margin:0 0 20px;font-size:1.1rem;">New Trading Profile</h3>
            <div class="form-group" style="margin-bottom:16px;">
                <label>Profile Name</label>
                <input type="text" id="nt-name" placeholder="e.g. Paper Test 1" style="width:100%;box-sizing:border-box;" />
            </div>
            <div class="form-group" style="margin-bottom:24px;">
                <label>Mode</label>
                <div style="display:flex;gap:12px;margin-top:8px;">
                    <label class="mode-radio">
                        <input type="radio" name="nt-mode" value="paper" checked />
                        <span class="mode-pill paper">🧪 Paper</span>
                    </label>
                    <label class="mode-radio">
                        <input type="radio" name="nt-mode" value="real" />
                        <span class="mode-pill real">💰 Real</span>
                    </label>
                </div>
            </div>
            <div style="display:flex;gap:12px;">
                <button id="nt-cancel" class="trading-save-btn outline-btn" style="flex:1;margin:0;background:transparent;color:var(--text-sub);border-color:var(--border-dim);">Cancel</button>
                <button id="nt-create" class="trading-save-btn" style="flex:2;margin:0;">Create Profile</button>
            </div>
        </div>
    </div>

    <!-- ── Chart Modal ───────────────────────────────────────────────────────── -->
    <div id="chart-modal" class="modal-backdrop hidden" style="z-index:1000;padding:0;background:var(--bg-panel);">
        <div class="modal" style="width:100vw;height:100vh;max-width:none;border-radius:0;padding:0;overflow:hidden;position:relative;border:none;">
            <iframe id="chart-frame" style="width:100%;height:100%;border:none;"></iframe>
        </div>
    </div>

    <!-- ── Exchange Modal ────────────────────────────────────────────────────── -->
    <div id="exchange-modal" class="modal-backdrop hidden" style="z-index:1001;">
        <div class="modal" style="max-width:600px;max-height:80vh;display:flex;flex-direction:column;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3 id="exchange-modal-title" style="margin:0;">Exchange</h3>
                <button id="close-exchange-modal" style="background:none;border:none;color:var(--text-sub);cursor:pointer;font-size:1.5rem;">&times;</button>
            </div>
            <p id="exchange-modal-status" class="text-sub" style="margin-bottom:16px;font-size:.9rem;"></p>
            <div id="exchange-modal-content" style="overflow-y:auto;background:var(--bg-row-alt);padding:12px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:.85rem;color:var(--text-sub);white-space:pre-wrap;flex:1;"></div>
        </div>
    </div>

    <script src="trading.js"></script>
    <script>
        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            document.getElementById('nav-menu').classList.toggle('open');
        });
    </script>
</body>
</html>
