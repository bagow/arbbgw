<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEX Spread Screener</title>
  <meta name="description"
    content="Real-time cross-exchange arbitrage spread monitor for Binance, Bybit and OKX perpetual futures." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>


  <!-- ── Table ──────────────────────────────────────────────────────────────── -->
  <main class="layout">
    <section class="panel panel--table" aria-label="Spread table">
      <div class="panel-header">
        <h1 class="panel-title">Live Spreads</h1>
        <span class="panel-sub" id="pair-count">–</span>
      </div>
      <!-- Exchange filter buttons (populated by JS from snapshot data) -->
      <div id="exchange-filters" class="exchange-filters"></div>
      <div class="table-wrap">
        <table id="spread-table">
          <thead>
            <tr>
              <th data-sort="pair">Pair</th>
              <th data-sort="exchangeA">Exch A</th>
              <th data-sort="exchangeB">Exch B</th>
              <th data-sort="priceA">Price A</th>
              <th data-sort="priceB">Price B</th>
              <th data-sort="spread" class="sorted-desc">Spread %</th>
              <th>Dir</th>
            </tr>
          </thead>
          <tbody id="spread-tbody">
            <tr class="placeholder-row">
              <td colspan="7">⟳ Fetching data…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ── Chart Modal ────────────────────────────────────────────────────────── -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal">

      <!-- Header -->
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modal-title">–</div>
          <div class="modal-sub" id="modal-sub">–</div>
        </div>
        <div class="modal-header-right">
          <!-- Timeframe buttons -->
          <div class="tf-bar">
            <button class="tf-btn" data-tf="15" id="tf-15s">15s</button>
            <button class="tf-btn tf-btn--active" data-tf="60" id="tf-1m">1m</button>
            <button class="tf-btn" data-tf="180" id="tf-3m">3m</button>
            <button class="tf-btn" data-tf="300" id="tf-5m">5m</button>
            <button class="tf-btn" data-tf="900" id="tf-15m">15m</button>
          </div>
          <!-- Live feed -->
          <div class="ws-bar">
            <span class="ws-label">Live:</span>
            <label class="ws-toggle"><input type="radio" name="ws-exchange" value="a" checked /> <span
                id="ws-label-a">Exch A</span></label>
            <label class="ws-toggle"><input type="radio" name="ws-exchange" value="b" /> <span id="ws-label-b">Exch
                B</span></label>
            <span id="ws-status" class="ws-indicator ws-indicator--off">●</span>
          </div>
          <a id="tv-link" class="tv-btn" href="#" target="_blank" rel="noopener noreferrer"
            title="Compare Spread on TradingView">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
          <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
        </div>
      </div>

      <!-- Charts -->
      <!-- Exchange legend — clickable toggles (populated dynamically by JS) -->
      <div id="chart-legend" class="chart-legend"></div>

      <div class="charts-wrap">

        <!-- Panel 1: both prices overlaid -->
        <div class="chart-row chart-row--price">
          <div class="chart-row-label" id="label-prices">Price (USD)</div>
          <div class="chart-svg-wrap" id="price-wrap">
            <svg id="chart-prices" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
              <g id="grid-p" class="grid"></g>
              <g id="ylabel-p" class="axis-labels"></g>
              <!-- Per-exchange price lines (rendered dynamically per exchange) -->
              <g id="price-lines"></g>
              <rect id="overlay-p" fill="transparent" style="cursor:crosshair" />
            </svg>
          </div>
        </div>

        <!-- Panel 2: signed spread histogram -->
        <div class="chart-row chart-row--hist">
          <div class="chart-row-label">Δ Spread</div>
          <div class="chart-svg-wrap" id="hist-wrap">
            <svg id="chart-hist" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
              <g id="grid-h" class="grid"></g>
              <g id="ylabel-h" class="axis-labels"></g>
              <g id="xlabel-h" class="axis-labels"></g>
              <!-- Histogram bars rendered dynamically -->
              <g id="bars-hist"></g>
              <g id="bars-live"></g>
              <!-- Zero line -->
              <line id="zero-line" class="zero-line" />
              <rect id="overlay-h" fill="transparent" style="cursor:crosshair" />
            </svg>
          </div>
        </div>

        <div id="chart-volume-info" class="volume-info"></div>

      </div><!-- /.charts-wrap -->

      <!-- Legend (populated dynamically by JS based on available exchanges) -->
      <div class="legend" id="legend-dynamic"></div>

    </div><!-- /.modal -->
  </div>

  <script src="chart.js"></script>
  <script>
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      document.getElementById('nav-menu').classList.toggle('open');
    });
  </script>
</body>

</html>
