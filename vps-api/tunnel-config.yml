# tunnel-config.yml – Cloudflare Tunnel configuration
# Replace YOUR_TUNNEL_ID with the ID from: cloudflared tunnel create cex-api

tunnel: YOUR_TUNNEL_ID
credentials-file: /home/opc/.cloudflared/YOUR_TUNNEL_ID.json

ingress:
  - hostname: api.arb.bagow.com
    service: http://localhost:4000
  - service: http_status:404
