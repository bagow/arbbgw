[package]
name = "real-trader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "real-trader"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-rusqlite = "0.5"
# Utilities
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Crypto for exchange API signing
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Rate limiting per exchange (token bucket)
governor = "0.6"
# Correct datetime for HTX HMAC signing
chrono = { version = "0.4", features = ["clock"] }


